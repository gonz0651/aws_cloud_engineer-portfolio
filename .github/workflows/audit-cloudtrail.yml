
name: AWS CloudTrail Security Audit

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: readG

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Install AWS SDK for Python
        run: python3 -m pip install boto3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::015312415472:role/GitHubPortfolioAuditRole
          aws-region: us-east-1

      - name: Retrieve and summarize CloudTrail events
        shell: bash
        env: 
          GRAFANA_LOKI_URL: https://logs-prod-021.grafana.net
          GRAFANA_LOKI_USER: "1879593"
          GRAFANA_LOKI_TOKEN: ${{ secrets.GRAFANA_LOKI_TOKEN }}
        run: |
          python3 - <<'PY'
          import boto3
          import base64
          import json
          import os
          import time
          from urllib.request import Request, urlopen
          from collections import Counter
          from datetime import datetime, timedelta, timezone

          client = boto3.client("cloudtrail", region_name="us-east-1")

          start = datetime.now(timezone.utc) - timedelta(days=7)

          selected = {
              "AssumeRoleWithWebIdentity",
              "CreateStack",
              "UpdateStack",
              "DeleteStack",
              "PutParameter"
          }

          counts = Counter()

          paginator = client.get_paginator("lookup_events")

          for page in paginator.paginate(
              StartTime=start,
              EndTime=datetime.now(timezone.utc),
          ):
              for event in page.get("Events", []):
                  name = event.get("EventName", "")
                  if name in selected:
                      counts[name] += 1

          print("AWS CloudTrail Security Audit")
          print("Region: us-east-1")
          print("Period: Last 7 days")
          print("-----------------------------")

          for name in sorted(selected):
              print(f"{name}: {counts[name]}")

          print("-----------------------------")
          print(f"Total selected events: {sum(counts.values())}")
          summary = {
              "region": "us-east-1",
              "window_days": 7,
              "counts": {name: counts[name] for name in sorted(selected)},
              "total": sum(counts.values()),
          }

          payload = {
              "streams": [{
                  "stream": {"job": "cloudtrail-audit"},
                  "values": [[str(time.time_ns()), json.dumps(summary)]],
              }],
          }

          token = os.environ.get("GRAFANA_LOKI_TOKEN")
          if not token:
              raise SystemExit("Missing GitHub Actions secret GRAFANA_LOKI_TOKEN")

          credentials = f"{os.environ['GRAFANA_LOKI_USER']}:{token}"
          authorization = base64.b64encode(credentials.encode()).decode()
          request = Request(
              os.environ["GRAFANA_LOKI_URL"].rstrip("/") + "/loki/api/v1/push",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": f"Basic {authorization}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          with urlopen(request, timeout=15) as response:
              print(f"Loki upload status: {response.status}")
          PY
